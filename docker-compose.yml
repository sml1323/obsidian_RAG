services:
  backend:
    build: ./backend
    container_name: agent_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      # Exclude venv from volume mount if possible, or just ignore it.
      # Anonymous volume for venv to prevent host venv sync (optional but good practice)
      - /app/venv
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - CHROMA_DB_PATH=${CHROMA_DB_PATH}
      - VAULT_PATH=${VAULT_PATH}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      # Pass potential keys if present in .env
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: agent_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev -- --host
  # Optional Ollama service (Uncomment if you want to run Ollama in a container)
